<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BAIAS-FOTO GALERY — Collections</title>

  <!-- fonts for the intro sections (the title uses IM Fell English, the text Space Grotesk) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">

  <!-- your existing styles (same as art.html) -->
  <link rel="stylesheet" href="./styles/media-querryies.css">
  <link rel="stylesheet" href="./styles/main.css">
  <link rel="stylesheet" href="./styles/header.css">
  <link rel="stylesheet" href="./styles/photogrid.css">
  <!-- the new styles: intro-sections first, collections.css last so it wins over the old ones -->
  <link rel="stylesheet" href="./styles/intro-sections.css">
  <link rel="stylesheet" href="./styles/collections.css">

  <!-- order matters: deferred scripts run in this order -->
  <script defer src="./javascript/app.js"></script>
  <script defer src="./javascript/vanilla-tilt.js"></script>
  <script defer src="./javascript/collections-data.js"></script>
  <script defer src="./javascript/collections.js"></script>
  <script defer src="./javascript/intro-sections.js"></script>
  <script src="./javascript/gsap.min.js"></script>

</head>
<body class="photogrid-page">
  <nav>
    <div class="animation-over"></div>
    <button class="js-button-music"><img class="ac-music" src="./PHOTOS/AC GRI.svg"><div class="rotate-wrapper"><img class="music-icon" src="./PHOTOS/SVG/compact-disc-solid.svg"></div></button>
      <div class="header" id="h1">
      <img class="logo a"  data-links="index.html"  src="./PHOTOS/SVG/Asset 1.svg">

      <div class="header-buttons">
        <button class="a" data-links="index.html">Home</button>
        <button class="a" data-links="art.html"  id="active-button">Art</button>
        <button class="a" data-links="tech.html">Tech</button>
        <button class="a" data-links="contact.html">Contact</button>
        <audio class="main-audio" loop>
        <source src="./randomAssets/Acejax feat. Danilyon - By My Side [NCS Release].mp3" type="audio/mp3">
        </audio>

      </div>

    </div>
    </nav>

    <main>

      <!-- ============ INTRO SECTIONS ============
           data-theme="dark"   dark version of your mockup
           data-theme="mockup" the exact greys from your mockup
           The texts below are plain HTML: change them here. -->
      <div class="intro-sections" data-theme="dark">

        <!-- 1. hero -->
        <section class="sec sec-hero" id="sec-hero" aria-label="Introduction">
          <div class="hero-panel"></div>
          <div class="hero-tilt" id="hero-tilt" aria-hidden="true"></div>
          <div class="hero-veil" aria-hidden="true"></div>
          <div class="hero-copy">
            <h1 class="hero-title" aria-label="BAIAS FOTO">
              <span class="t-line" data-split>BAIAS</span>
              <span class="t-line" data-split>FOTO</span>
            </h1>
            <p class="hero-desc">Night in the city,<br>summer in Italy, the street by day.<!-- replace with your own sentence --></p>
          </div>
        </section>

        <!-- 2. wall of photos -->
        <section class="sec sec-wall" id="sec-wall" aria-label="Selected photographs">
          <div class="wall-panel">
            <div class="wall-window" id="wall-window"></div>
          </div>
        </section>

      </div>

      <div class="title-galery">
        <div class="left-line"></div>
        <div>PHOTO GALERY</div>
        <div class="right-line"></div>
      </div>

      <!-- filled by collections.js from collections-data.js -->
      <div id="collections"></div>

    </main>

</body>
</html>
